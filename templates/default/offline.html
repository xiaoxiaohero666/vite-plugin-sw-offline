<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>网络连接失败</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #131529;
      background-image: url('/static/offline-bg.jpg');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      color: #ffffff;
    }

    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 品牌 LOGO */
    .logo-wrap {
      margin-bottom: 20px;
    }

    .logo-wrap img {
      width: 120px;
      height: auto;
      display: block;
      border-radius: 20px;
    }

    /* 模拟浏览器搜索框 */
    .search-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 324px;
      height: 36px;
      border-radius: 18px;
      border: 1px solid #447AFE;
      background: #0E1628;
      margin-bottom: 24px;
    }

    .search-bar-input {
      width: 260px;
      height: 28px;
      border-radius: 18px;
      background: #FFF;
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: #4077FF;
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 20px;
      font-weight: 600;
      line-height: normal;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 5px;
    }

    .search-bar-btn {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .search-bar-btn svg {
      width: 18px;
      height: 18px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* 打字机光标闪烁 */
    .typing-cursor {
      display: inline-block;
      color: #4077FF;
      font-weight: 400;
      animation: blink 0.8s step-end infinite;
      margin-left: 1px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ffffff;
    }

    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 40px;
      line-height: 1.8;
      padding: 0 10px;
    }

    .buttons {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .btn {
      flex: 1;
      max-width: 170px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-primary {
      background: linear-gradient(180deg, #6591FD 0%, #3D75FF 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(74, 124, 255, 0.3);
    }

    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1000;
    }

    .copy-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 品牌 LOGO（构建时注入路径，加载失败则隐藏） -->
    <div class="logo-wrap" id="logoWrap">
      <img src="__OFFLINE_LOGO__" alt="" onerror="document.getElementById('logoWrap').style.display='none'" />
    </div>

    <!-- 模拟浏览器搜索框 -->
    <div class="search-bar">
      <div class="search-bar-input">
        <span id="typingText"></span><span class="typing-cursor">|</span>
      </div>
      <div class="search-bar-btn" id="copyDomainBtn" role="button" tabindex="0" aria-label="">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
    </div>

    <h1 id="offline-heading">网络连接失败</h1>
    <p id="offline-body">请检查网络设置后重试，或联系客服获取帮助，若无法重启，请您耐心等待并稍后再进行尝试。</p>

    <div class="buttons">
      <a class="btn btn-secondary" href="javascript:void(0)" id="contactBtn">联系客服</a>
      <button type="button" class="btn btn-primary" id="reloadBtn" onclick="location.reload()">重新加载</button>
    </div>
  </div>

  <div class="copy-toast" id="copyToast" aria-live="polite"></div>

  <script>
    window.__OFFLINE_I18N__ = __OFFLINE_I18N_INJECT__;
    var offlineDomainText = '__OFFLINE_DOMAIN__';

    (function applyOfflineLocale() {
      var M = window.__OFFLINE_I18N__ || {};
      var SHORT_TO_FULL = {
        en: 'en_US',
        zh: 'zh_CN',
        ja: 'ja_JP',
        ko: 'ko_KR',
        ar: 'ar_SA',
        hi: 'hi_IN',
        pt: 'pt_BR',
        ru: 'ru_RU',
        th: 'th_TH',
        tr: 'tr_TR',
        vi: 'vi_VN',
        es: 'es_MX'
      };
      function normalizeLocaleKey(s) {
        if (!s || typeof s !== 'string') return '';
        s = s.trim().replace(/-/g, '_');
        if (s.indexOf('_') === -1) return SHORT_TO_FULL[s.toLowerCase()] || '';
        var i = s.indexOf('_');
        return s.slice(0, i).toLowerCase() + '_' + s.slice(i + 1).toUpperCase();
      }
      function resolveOfflineLocaleKey() {
        var fromUrl = '';
        try {
          fromUrl = new URLSearchParams(window.location.search).get('locale') || '';
        } catch (e) {}
        var fromStorage = '';
        try {
          var rawCommon = localStorage.getItem('common');
          if (rawCommon) {
            var parsed = JSON.parse(rawCommon);
            if (parsed && typeof parsed.locale === 'string') fromStorage = parsed.locale;
          }
        } catch (e) {}
        return normalizeLocaleKey(fromUrl) || normalizeLocaleKey(fromStorage) || 'zh_CN';
      }
      var loc = resolveOfflineLocaleKey();
      if (!M[loc]) loc = 'zh_CN';
      var t = M[loc] || M.zh_CN;
      if (!t) return;
      document.documentElement.setAttribute('lang', loc.replace('_', '-'));
      if (loc.indexOf('ar_') === 0) document.documentElement.setAttribute('dir', 'rtl');
      document.title = t.title;
      var el = document.getElementById('offline-heading');
      if (el) el.textContent = t.heading;
      el = document.getElementById('offline-body');
      if (el) el.textContent = t.body;
      el = document.getElementById('contactBtn');
      if (el) el.textContent = t.contact;
      el = document.getElementById('reloadBtn');
      if (el) el.textContent = t.reload;
      el = document.getElementById('copyDomainBtn');
      if (el) el.setAttribute('aria-label', t.copyAria);
      el = document.getElementById('copyToast');
      if (el) el.textContent = t.copySuccess;
      window.__offlineUiStrings = {
        copySuccess: t.copySuccess,
        copyFail: t.copyFail,
        contactOfflineHint: t.contactOfflineHint
      };
    })();

    // 打字机动画
    (function() {
      var text = offlineDomainText;
      var el = document.getElementById('typingText');
      var i = 0;
      var isDeleting = false;
      var typeSpeed = 120;
      var deleteSpeed = 60;
      var pauseAfterType = 1800;
      var pauseAfterDelete = 400;

      function tick() {
        if (!isDeleting) {
          el.textContent = text.slice(0, i + 1);
          i++;
          if (i === text.length) {
            isDeleting = true;
            setTimeout(tick, pauseAfterType);
            return;
          }
          setTimeout(tick, typeSpeed);
        } else {
          el.textContent = text.slice(0, i - 1);
          i--;
          if (i === 0) {
            isDeleting = false;
            setTimeout(tick, pauseAfterDelete);
            return;
          }
          setTimeout(tick, deleteSpeed);
        }
      }

      setTimeout(tick, 600);
    })();

    // 搜索按钮：复制域名到剪贴板
    (function() {
      var copyBtn = document.getElementById('copyDomainBtn');
      var toast = document.getElementById('copyToast');
      var toastTimer = null;

      function showCopyToast() {
        if (window.__offlineUiStrings && window.__offlineUiStrings.copySuccess) {
          toast.textContent = window.__offlineUiStrings.copySuccess;
        }
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
          toast.classList.remove('show');
        }, 2000);
      }

      function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function(resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try {
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            ok ? resolve() : reject(new Error('copy failed'));
          } catch (err) {
            document.body.removeChild(ta);
            reject(err);
          }
        });
      }

      function handleCopy() {
        var text = (offlineDomainText || '').trim();
        if (!text) return;
        copyToClipboard(text).then(showCopyToast).catch(function() {
          var msg = (window.__offlineUiStrings && window.__offlineUiStrings.copyFail) || '';
          alert(msg);
        });
      }

      copyBtn.addEventListener('click', handleCopy);
      copyBtn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleCopy();
        }
      });
    })();

    // 尝试从 localStorage 获取客服链接
    document.getElementById('contactBtn').addEventListener('click', function() {
      var customerServiceUrl = localStorage.getItem('customerServiceUrl');
      if (customerServiceUrl) {
        window.open(customerServiceUrl, '_blank');
      } else {
        var msg = (window.__offlineUiStrings && window.__offlineUiStrings.contactOfflineHint) || '';
        alert(msg);
      }
    });

    // 监听网络恢复
    window.addEventListener('online', function() {
      location.reload();
    });
  </script>
</body>
</html>
