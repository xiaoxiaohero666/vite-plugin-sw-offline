<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>网络连接失败</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
      --offline-glow: rgba(15, 23, 42, 0.18);
      --offline-glow-soft: rgba(15, 23, 42, 0.08);
      --offline-shine: rgba(255,255,255,0.12);
    }



    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      color: #1e293b;
      background-color: #f8fafc;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(148, 163, 184, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(148, 163, 184, 0.1) 0%, transparent 45%),
        linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap { margin-bottom: 28px; }

    .logo-wrap img {
      width: 96px;
      height: auto;
      display: block;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }

    .search-bar {
      display: flex;
      align-items: center;
      width: min(100%, 340px);
      height: 50px;
      padding: 0 6px 0 16px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      margin-bottom: 32px;
      gap: 8px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .search-bar-input {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      color: #0f172a;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-bar-btn {
      flex-shrink: 0;
      width: 40px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #f1f5f9;
      color: #475569;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .search-bar-btn:hover { background: #e2e8f0; color: #0f172a; }
    .search-bar-btn:active { transform: scale(0.94); }
    .search-bar-btn svg { width: 18px; height: 18px; }

    .typing-cursor {
      display: inline-block;
      color: #64748b;
      animation: blink 0.8s step-end infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 36px;
      line-height: 1.75;
    }

    .buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      flex: 1;
      max-width: 168px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.97); }

    .btn-secondary {
      background: #ffffff;
      color: #334155;
      border: 1px solid #e2e8f0;
    }

    .btn-primary {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
    }

    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 10px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2);
    }

    .copy-toast.show { opacity: 1; }
    /* skin-motion */
    body::before {
      animation: minimal-grid-shift 20s linear infinite;
    }
    @keyframes minimal-grid-shift {
      to { background-position: 24px 24px; }
    }
    .search-bar-input::after { opacity: 0.2; }
    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }
  </style>
  <style>
__OFFLINE_PAGE_STYLES__
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap" id="logoWrap">
      <img src="__OFFLINE_LOGO__" alt="" onerror="document.getElementById('logoWrap').style.display='none'" />
    </div>
    <div class="search-bar">
      <div class="search-bar-input">
        <span id="typingText"></span><span class="typing-cursor">|</span>
      </div>
      <div class="search-bar-btn" id="copyDomainBtn" role="button" tabindex="0" aria-label="">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </div>
    </div>
    <h1 id="offline-heading">网络连接失败</h1>
    <p id="offline-body">请检查网络设置后重试，或联系客服获取帮助，若无法重启，请您耐心等待并稍后再进行尝试。</p>
    <div class="buttons">
      <a class="btn btn-secondary" href="javascript:void(0)" id="contactBtn">联系客服</a>
      <button type="button" class="btn btn-primary" id="reloadBtn" onclick="location.reload()">重新加载</button>
    </div>
  </div>
  <div class="copy-toast" id="copyToast" aria-live="polite"></div>
  <script>
__OFFLINE_PAGE_SCRIPT__
  </script>

</body>
</html>
