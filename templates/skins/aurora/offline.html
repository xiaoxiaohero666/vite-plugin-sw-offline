<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>网络连接失败</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

        :root {
      --offline-glow: rgba(167, 139, 250, 0.55);
      --offline-glow-soft: rgba(139, 92, 246, 0.22);
      --offline-shine: rgba(255,255,255,0.3);
    }



    :root {
      --aurora-violet: #8b5cf6;
      --aurora-cyan: #22d3ee;
      --aurora-pink: #f472b6;
      --aurora-mint: #34d399;
      --text-primary: #f8fafc;
      --text-muted: rgba(248, 250, 252, 0.62);
      --glass-bg: rgba(15, 23, 42, 0.55);
      --glass-border: rgba(255, 255, 255, 0.14);
      --accent: #a78bfa;
      --accent-strong: #7c3aed;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      color: var(--text-primary);
      background-color: #070b14;
      background-image:
        radial-gradient(ellipse 90% 55% at 50% -8%, rgba(139, 92, 246, 0.42) 0%, transparent 58%),
        radial-gradient(ellipse 70% 45% at 92% 42%, rgba(34, 211, 238, 0.22) 0%, transparent 52%),
        radial-gradient(ellipse 65% 50% at 8% 72%, rgba(244, 114, 182, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 72% 88%, rgba(52, 211, 153, 0.12) 0%, transparent 50%),
        linear-gradient(165deg, #0c1222 0%, #15103a 42%, #0a1628 100%);
      overflow: hidden;
      position: relative;
    }

    /* 星点纹理 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 12%, rgba(255, 255, 255, 0.28) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 68%, rgba(255, 255, 255, 0.22) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 76%, rgba(255, 255, 255, 0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 24% 88%, rgba(255, 255, 255, 0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 62% 32%, rgba(255, 255, 255, 0.18) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* 缓慢流动的光晕 */
    body::after {
      content: '';
      position: fixed;
      width: 140%;
      height: 60%;
      left: -20%;
      top: -10%;
      background: radial-gradient(ellipse at center, rgba(167, 139, 250, 0.12) 0%, transparent 70%);
      animation: aurora-drift 14s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes aurora-drift {
      0% { transform: translateX(-3%) translateY(0) scale(1); opacity: 0.85; }
      100% { transform: translateX(3%) translateY(2%) scale(1.05); opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap {
      margin-bottom: 28px;
    }

    .logo-wrap img {
      width: 108px;
      height: auto;
      display: block;
      border-radius: 22px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 12px 40px rgba(0, 0, 0, 0.35),
        0 0 48px rgba(139, 92, 246, 0.2);
    }

    /* 域名条：毛玻璃 + 复制按钮 */
    .search-bar {
      display: flex;
      align-items: center;
      width: min(100%, 340px);
      height: 48px;
      padding: 0 6px 0 16px;
      border-radius: 14px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      margin-bottom: 32px;
      gap: 8px;
    }

    .search-bar-input {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      color: var(--aurora-cyan);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-bar-btn {
      flex-shrink: 0;
      width: 40px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.35) 0%, rgba(34, 211, 238, 0.2) 100%);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: #e9d5ff;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .search-bar-btn:hover {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.5) 0%, rgba(34, 211, 238, 0.35) 100%);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
    }

    .search-bar-btn:active {
      transform: scale(0.94);
    }

    .search-bar-btn svg {
      width: 18px;
      height: 18px;
    }

    .typing-cursor {
      display: inline-block;
      color: var(--aurora-cyan);
      font-weight: 400;
      animation: blink 0.8s step-end infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, rgba(226, 232, 240, 0.88) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 36px;
      line-height: 1.75;
      padding: 0 4px;
    }

    .buttons {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    .btn {
      flex: 1;
      max-width: 168px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.97);
      opacity: 0.92;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(248, 250, 252, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #a78bfa 0%, #6366f1 48%, #22d3ee 100%);
      color: #ffffff;
      box-shadow:
        0 4px 20px rgba(99, 102, 241, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: #f8fafc;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    /* skin-motion */
    body::after { animation-duration: 11s; }
    .search-bar-input { animation: offline-domain-pulse 2.5s ease-in-out infinite; }
    @keyframes offline-domain-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .search-bar-input { animation: none; }
    }
  </style>
  <style>
__OFFLINE_PAGE_STYLES__
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap" id="logoWrap">
      <img src="__OFFLINE_LOGO__" alt="" onerror="document.getElementById('logoWrap').style.display='none'" />
    </div>

    <div class="search-bar">
      <div class="search-bar-input">
        <span id="typingText"></span><span class="typing-cursor">|</span>
      </div>
      <div class="search-bar-btn" id="copyDomainBtn" role="button" tabindex="0" aria-label="">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </div>
    </div>

    <h1 id="offline-heading">网络连接失败</h1>
    <p id="offline-body">请检查网络设置后重试，或联系客服获取帮助，若无法重启，请您耐心等待并稍后再进行尝试。</p>

    <div class="buttons">
      <a class="btn btn-secondary" href="javascript:void(0)" id="contactBtn">联系客服</a>
      <button type="button" class="btn btn-primary" id="reloadBtn" onclick="location.reload()">重新加载</button>
    </div>
  </div>

  <div class="copy-toast" id="copyToast" aria-live="polite"></div>
  <script>
__OFFLINE_PAGE_SCRIPT__
  </script>

</body>
</html>
