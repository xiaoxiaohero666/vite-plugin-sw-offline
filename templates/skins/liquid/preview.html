  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
      --offline-glow: rgba(236, 72, 153, 0.45);
      --offline-glow-soft: rgba(139, 92, 246, 0.2);
      --offline-shine: rgba(255,255,255,0.35);
    }



    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      color: #fff;
      background: #0f0a1a;
      overflow: hidden;
      position: relative;
    }

    .bg-fx {
      position: fixed;
      inset: 0;
      z-index: 0;
      filter: blur(48px);
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.75;
    }

    .blob-1 {
      width: 55vw;
      height: 55vw;
      max-width: 420px;
      max-height: 420px;
      background: #8b5cf6;
      top: -10%;
      left: -10%;
      animation: blob-a 14s ease-in-out infinite;
    }

    .blob-2 {
      width: 50vw;
      height: 50vw;
      max-width: 380px;
      max-height: 380px;
      background: #ec4899;
      bottom: -15%;
      right: -10%;
      animation: blob-b 16s ease-in-out infinite;
    }

    .blob-3 {
      width: 45vw;
      height: 45vw;
      max-width: 340px;
      max-height: 340px;
      background: #06b6d4;
      top: 40%;
      left: 35%;
      animation: blob-c 18s ease-in-out infinite;
    }

    @keyframes blob-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(12%, 18%) scale(1.1); }
      66% { transform: translate(-8%, 10%) scale(0.95); }
    }

    @keyframes blob-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-15%, -12%) scale(1.08); }
    }

    @keyframes blob-c {
      0%, 100% { transform: translate(0, 0) scale(1); }
      40% { transform: translate(-12%, -18%) scale(1.12); }
      70% { transform: translate(10%, -8%) scale(0.9); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap { margin-bottom: 28px; }
    .logo-wrap img {
      width: 108px;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .search-bar {
      display: flex;
      align-items: center;
      width: min(100%, 340px);
      height: 48px;
      padding: 0 6px 0 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-bottom: 32px;
      gap: 8px;
    }

    .search-bar-input {
      flex: 1;
      min-width: 0;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-bar-btn {
      width: 40px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    .search-bar-btn:active { transform: scale(0.94); }
    .search-bar-btn svg { width: 18px; height: 18px; }

    .typing-cursor { animation: blink 0.8s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    h1 { font-size: 24px; font-weight: 700; margin-bottom: 14px; }
    p { font-size: 14px; color: rgba(255,255,255,.75); margin-bottom: 36px; line-height: 1.75; }

    .buttons { display: flex; gap: 14px; width: 100%; justify-content: center; }

    .btn {
      flex: 1;
      max-width: 168px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.2); }
    .btn-primary { background: #fff; color: #6d28d9; box-shadow: 0 8px 28px rgba(0,0,0,.2); }

    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 20px;
      background: rgba(255,255,255,.95);
      color: #4c1d95;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1000;
    }

    .copy-toast.show { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
    }

    /* skin-motion */
    .blob-1 { animation-duration: 11s; }
    .blob-2 { animation-duration: 13s; }
    .blob-3 { animation-duration: 15s; }
    .btn-primary:hover { transform: translateY(-3px) scale(1.02); }

    offline-bar-glow 3.2s ease-in-out infinite;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.search-bar:active {
  transform: scale(0.99);
}

.search-bar-input {
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.2s ease;
}

.search-bar-input::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    105deg,
    transparent 35%,
    var(--offline-shine) 50%,
    transparent 65%
  );
  background-size: 200% 100%;
  animation: offline-input-shimmer 4s ease-in-out infinite;
  pointer-events: none;
  opacity: 0.5;
}

.search-bar-btn {
  transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.search-bar-btn:hover,
.search-bar-btn:focus-visible {
  transform: scale(1.06);
  box-shadow: 0 0 14px var(--offline-glow-soft);
}

.search-bar-btn:active {
  transform: scale(0.94);
}

h1#offline-heading {
  animation:
    offline-fade-up 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both,
    offline-heading-glow 3.5s ease-in-out infinite;
}

p#offline-body {
  animation: offline-fade-up 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.24s both;
}

.buttons {
  animation: offline-fade-up 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
}

.btn {
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

.btn:hover,
.btn:focus-visible {
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0) scale(0.97);
}

.btn-primary {
  animation: offline-btn-primary-pulse 2.8s ease-in-out infinite;
}

.btn-primary::after {
  content: '';
  position: absolute;
  top: 0;
  width: 45%;
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--offline-shine), transparent);
  animation: offline-btn-shine 3.5s ease-in-out infinite;
  pointer-events: none;
}

.btn-secondary:hover,
.btn-secondary:focus-visible {
  box-shadow: 0 0 16px var(--offline-glow-soft);
}

.copy-toast {
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.copy-toast.show {
  transform: translateX(-50%) translateY(-6px);
}

.typing-cursor {
  animation: offline-cursor-blink 0.85s step-end infinite;
}

@keyframes offline-cursor-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .container,
  .logo-wrap,
  .logo-wrap img,
  .search-bar,
  .search-bar-input::after,
  h1#offline-heading,
  p#offline-body,
  .buttons,
  .btn,
  .btn-primary,
  .btn-primary::after {
    animation: none !important;
  }

  .search-bar-input::after {
    display: none;
  }

  .btn:hover,
  .btn:focus-visible,
  .search-bar-btn:hover {
    transform: none;
  }
}

    s = s.trim().replace(/-/g, '_');
    if (s.indexOf('_') === -1) return SHORT_TO_FULL[s.toLowerCase()] || '';
    var i = s.indexOf('_');
    return s.slice(0, i).toLowerCase() + '_' + s.slice(i + 1).toUpperCase();
  }

  function getDefaultLocaleKey() {
    var d = window.__OFFLINE_DEFAULT_LOCALE__;
    return d && typeof d === 'string' ? d : 'zh_CN';
  }

  function resolveOfflineLocaleKey() {
    var fromUrl = '';
    try {
      fromUrl = new URLSearchParams(window.location.search).get('locale') || '';
    } catch (e) {}
    var fromStorage = '';
    try {
      var rawCommon = localStorage.getItem('common');
      if (rawCommon) {
        var parsed = JSON.parse(rawCommon);
        if (parsed && typeof parsed.locale === 'string') fromStorage = parsed.locale;
      }
    } catch (e) {}
    return normalizeLocaleKey(fromUrl) || normalizeLocaleKey(fromStorage) || getDefaultLocaleKey();
  }

  function applyOfflineLocale() {
    var M = window.__OFFLINE_I18N__ || {};
    var fallback = getDefaultLocaleKey();
    var loc = resolveOfflineLocaleKey();
    if (!M[loc]) loc = fallback;
    var t = M[loc] || M[fallback];
    if (!t) return;
    document.documentElement.setAttribute('lang', loc.replace('_', '-'));
    if (loc.indexOf('ar_') === 0) document.documentElement.setAttribute('dir', 'rtl');
    document.title = t.title;
    var el = document.getElementById('offline-heading');
    if (el) el.textContent = t.heading;
    el = document.getElementById('offline-body');
    if (el) el.textContent = t.body;
    el = document.getElementById('contactBtn');
    if (el) el.textContent = t.contact;
    el = document.getElementById('reloadBtn');
    if (el) el.textContent = t.reload;
    el = document.getElementById('copyDomainBtn');
    if (el) el.setAttribute('aria-label', t.copyAria);
    el = document.getElementById('copyToast');
    if (el) el.textContent = t.copySuccess;
    window.__offlineUiStrings = {
      copySuccess: t.copySuccess,
      copyFail: t.copyFail,
      contactOfflineHint: t.contactOfflineHint
    };
  }

  function startTypingAnimation() {
    var text = window.__OFFLINE_DOMAIN_TEXT__ || '';
    var el = document.getElementById('typingText');
    if (!el || !text) return;
    var i = 0;
    var isDeleting = false;
    var typeSpeed = 120;
    var deleteSpeed = 60;
    var pauseAfterType = 1800;
    var pauseAfterDelete = 400;

    function tick() {
      if (!isDeleting) {
        el.textContent = text.slice(0, i + 1);
        i++;
        if (i === text.length) {
          isDeleting = true;
          setTimeout(tick, pauseAfterType);
          return;
        }
        setTimeout(tick, typeSpeed);
      } else {
        el.textContent = text.slice(0, i - 1);
        i--;
        if (i === 0) {
          isDeleting = false;
          setTimeout(tick, pauseAfterDelete);
          return;
        }
        setTimeout(tick, deleteSpeed);
      }
    }

    setTimeout(tick, 600);
  }

  function bindCopyDomain() {
    var copyBtn = document.getElementById('copyDomainBtn');
    var toast = document.getElementById('copyToast');
    if (!copyBtn) return;
    var toastTimer = null;

    function showCopyToast() {
      if (toast) {
        if (window.__offlineUiStrings && window.__offlineUiStrings.copySuccess) {
          toast.textContent = window.__offlineUiStrings.copySuccess;
        }
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 2000);
      }
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        } catch (err) {
          document.body.removeChild(ta);
          reject(err);
        }
      });
    }

    function handleCopy() {
      var text = (window.__OFFLINE_DOMAIN_TEXT__ || '').trim();
      if (!text) return;
      copyToClipboard(text)
        .then(showCopyToast)
        .catch(function () {
          var msg = (window.__offlineUiStrings && window.__offlineUiStrings.copyFail) || '';
          alert(msg);
        });
    }

    copyBtn.addEventListener('click', handleCopy);
    copyBtn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleCopy();
      }
    });
  }

  function bindContactBtn() {
    var contactBtn = document.getElementById('contactBtn');
    if (!contactBtn) return;
    contactBtn.addEventListener('click', function () {
      var customerServiceUrl = localStorage.getItem('customerServiceUrl');
      if (customerServiceUrl) {
        window.open(customerServiceUrl, '_blank');
      } else {
        var msg = (window.__offlineUiStrings && window.__offlineUiStrings.contactOfflineHint) || '';
        alert(msg);
      }
    });
  }

  function bindOnlineReload() {
    window.addEventListener('online', function () {
      location.reload();
    });
  }

  /** 按 __OFFLINE_RELOAD_INTERVAL__（ms）定时刷新；未设或 ≤0 则不开启 */
  function bindAutoReload() {
    var ms = window.__OFFLINE_RELOAD_INTERVAL__;
    if (typeof ms !== 'number' || !isFinite(ms) || ms <= 0) return;
    setInterval(function () {
      location.reload();
    }, Math.floor(ms));
  }

  applyOfflineLocale();
  startTypingAnimation();
  bindCopyDomain();
  bindContactBtn();
  bindOnlineReload();
  bindAutoReload();
})();

  </script>
</body>
</html>
