<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>网络连接失败</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
      --offline-glow: rgba(34, 211, 238, 0.5);
      --offline-glow-soft: rgba(168, 85, 247, 0.22);
      --offline-shine: rgba(255,255,255,0.3);
    }



    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      color: #e0f2fe;
      background: #020617;
      overflow: hidden;
      perspective: 400px;
    }

    .bg-fx {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .grid-floor {
      position: absolute;
      width: 200%;
      height: 75%;
      left: -50%;
      bottom: -28%;
      transform: rotateX(74deg);
      transform-origin: center bottom;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.35) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: grid-move 3s linear infinite;
      mask-image: linear-gradient(to top, #000 18%, transparent 72%);
      -webkit-mask-image: linear-gradient(to top, #000 18%, transparent 72%);
    }

    /* 顶部天光 + 两侧氛围，避免横线穿过中部按钮区 */
    .sky-glow {
      position: absolute;
      top: -15%;
      left: 50%;
      width: 140%;
      height: 42%;
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse 70% 80% at 50% 100%,
        rgba(34, 211, 238, 0.22) 0%,
        rgba(168, 85, 247, 0.1) 45%,
        transparent 72%
      );
      animation: sky-breathe 6s ease-in-out infinite alternate;
    }

    .side-glow {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 28%;
      opacity: 0.85;
    }

    .side-glow--left {
      left: 0;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.14) 0%, transparent 100%);
    }

    .side-glow--right {
      right: 0;
      background: linear-gradient(270deg, rgba(168, 85, 247, 0.14) 0%, transparent 100%);
    }

    @keyframes grid-move {
      to { background-position: 0 48px; }
    }

    @keyframes sky-breathe {
      0% { opacity: 0.75; transform: translateX(-50%) scale(1); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.04); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(34, 211, 238, 0.12);
      box-shadow: 0 0 48px rgba(2, 6, 23, 0.6);
    }

    .logo-wrap { margin-bottom: 28px; }
    .logo-wrap img {
      width: 108px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(34, 211, 238, 0.35);
    }

    .search-bar {
      display: flex;
      align-items: center;
      width: min(100%, 340px);
      height: 48px;
      padding: 0 6px 0 16px;
      border-radius: 4px;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid #22d3ee;
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.2), inset 0 0 12px rgba(34, 211, 238, 0.05);
      margin-bottom: 32px;
      gap: 8px;
    }

    .search-bar-input {
      flex: 1;
      min-width: 0;
      color: #67e8f9;
      font-size: 16px;
      font-weight: 600;
      font-family: ui-monospace, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-bar-btn {
      width: 40px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #a855f7;
      border-radius: 2px;
      cursor: pointer;
      background: rgba(168, 85, 247, 0.2);
      color: #e9d5ff;
      -webkit-tap-highlight-color: transparent;
    }

    .search-bar-btn:active { transform: scale(0.94); }
    .search-bar-btn svg { width: 18px; height: 18px; }

    .typing-cursor { color: #a855f7; animation: blink 0.8s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
    }

    p { font-size: 14px; color: rgba(224, 242, 254, 0.6); margin-bottom: 36px; line-height: 1.75; }

    .buttons { display: flex; gap: 14px; width: 100%; justify-content: center; }

    .btn {
      flex: 1;
      max-width: 168px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.97); }

    .btn-secondary {
      background: transparent;
      color: #67e8f9;
      border: 1px solid rgba(34, 211, 238, 0.5);
    }

    .btn-primary {
      background: linear-gradient(90deg, #0891b2, #7c3aed);
      color: #fff;
      border: none;
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
    }

    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 2px;
      background: rgba(2, 6, 23, 0.95);
      border: 1px solid #22d3ee;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1000;
    }

    .copy-toast.show { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .grid-floor, .sky-glow { animation: none; }
      .sky-glow { opacity: 0.85; transform: translateX(-50%); }
    }

    /* skin-motion */
    .grid-floor { animation-duration: 2.4s; }
    .sky-glow { animation-duration: 5s; }
  </style>
  <style>
__OFFLINE_PAGE_STYLES__
  </style>
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="sky-glow"></div>
    <div class="side-glow side-glow--left"></div>
    <div class="side-glow side-glow--right"></div>
    <div class="grid-floor"></div>
  </div>
  <div class="container">
    <div class="logo-wrap" id="logoWrap">
      <img src="__OFFLINE_LOGO__" alt="" onerror="document.getElementById('logoWrap').style.display='none'" />
    </div>
    <div class="search-bar">
      <div class="search-bar-input">
        <span id="typingText"></span><span class="typing-cursor">|</span>
      </div>
      <div class="search-bar-btn" id="copyDomainBtn" role="button" tabindex="0" aria-label="">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </div>
    </div>
    <h1 id="offline-heading">网络连接失败</h1>
    <p id="offline-body">请检查网络设置后重试，或联系客服获取帮助，若无法重启，请您耐心等待并稍后再进行尝试。</p>
    <div class="buttons">
      <a class="btn btn-secondary" href="javascript:void(0)" id="contactBtn">联系客服</a>
      <button type="button" class="btn btn-primary" id="reloadBtn" onclick="location.reload()">重新加载</button>
    </div>
  </div>
  <div class="copy-toast" id="copyToast" aria-live="polite"></div>
  <script>
__OFFLINE_PAGE_SCRIPT__
  </script>
</body>
</html>
